  - name: TX_ARM_STATE
    address: 0x0202
    access: "RO"
    content: "[3:0] state 0 disarmed, 1 armed, 2 inhibited; [15:8] last reject reason; [23:16] last drop reason; [31:24] arm generation (+1 per arm, wraps) (Table B8-3)"
    sent: "on every change"
    source: "0007 Decision 1; 0006; 0020 §8"
  - name: TX_STATE
    address: 0x0203
    access: "RO"
    content: "bit 0 keyed (PA actually keyed); bit 1 `WARN` active; bit 2 `REDUCE` active; bit 3 last TX request outside the TX ranges; bit 4 PA disabled by the host (General byte 58 bit [0]); bit 5 inhibit active; [11:8] TX source 0 none, 1 PTT, 2 CWX, 3 KEY, 4 ATU; [23:16] last unkey reason 0 none, 1 TX request released, 2 keyed timeout, 3 TX IQ underrun, 4 limit, 5 arm dropped; [31:24] limit id when reason 4"
