registers:
  - name: "capability record (Table B4-1)"
    address: 0x0000
    address_end: 0x00CE
    access: "RO"
    content: "Table B4-1"
    sent: "on `CAP_REQUEST`; once per session"
    source: "0003 §2, §3; 0020 §26"
  - name: CAP_REQUEST
    address: 0x0100
    access: "W, any host"
    content: "0x00000001 requests the record; other values `BAD_VALUE`"
    sent: "answer"
    source: "0003 §2; 0020 §5"
  - name: STREAM_STATUS
    address: 0x0101
    access: "RO"
    content: "one byte per stream: [7:0] DDC0, [15:8] DUC0, [23:16] microphone, [31:24] wideband; bit 7 running, [6:0] reason (Table B8-3)"
    sent: "on change"
    source: "0004 point 7; 0020 §8"
  - name: LINK_STATUS
    address: 0x0102
    access: "RO"
    content: "[15:0] speed in Mbit/s (0 = link down); bit 16 full duplex; bit 17 non-default P2 port not honoured (latched until the next session); [31:24] session refusal reason: 0 none, 1 link below 100 Mbit/s"
    sent: "on change; B5.8"
    source: "0003 §2; 0004 point 9; 0020 §8, §13, §20"
  - name: WRITE_STATUS
    address: 0x0103
    access: "RO"
    content: "last rejected write, B8.4"
    sent: "on every rejection, to the writer"
    source: "0020 §11"
  - name: TX_ARM_TOKEN
    address: 0x0200
    access: "RO"
    content: "32-bit token; never 0, 0xFFFFFFFF or `ARM_MAGIC`; differs from the previous token"
    sent: "at session start and on every change"
    source: "0007 Decision 1; 0020 §7"
  - name: TX_ARM
    address: 0x0201
    access: "W, owner"
    content: "`token XOR ARM_MAGIC` arms; 0 disarms; any other value rejected (`BAD_TOKEN` in `TX_ARM_STATE`)"
    sent: "answer is `TX_ARM_STATE`"
    source: "0007 Decision 1; 0020 §7"
  - name: TX_ARM_STATE
    address: 0x0202
    access: "RO"
    content: "[3:0] state 0 disarmed, 1 armed, 2 inhibited (armed, but a limit inhibit is active so TX requests do not key; entered from 1 when an inhibit starts, back to 1 when it lifts, no new generation); [15:8] last reject reason of the owner; [23:16] last drop reason; [31:24] arm generation (+1 per arm, wraps) (Table B8-3)"
    sent: "on every change"
    source: "0007 Decision 1; 0006; 0020 §8; 0022 §13"
  - name: TX_STATE
    address: 0x0203
    access: "RO"
    content: "bit 0 keyed (PA actually keyed); bit 1 `WARN` active; bit 2 `REDUCE` active; bit 3 last TX request outside the TX ranges; bit 4 PA disabled by the host (General byte 58 bit [0]); bit 5 inhibit active; [11:8] TX source 0 none, 1 PTT, 2 CWX, 3 KEY, 4 ATU; [23:16] last unkey reason 0 none, 1 TX request released, 2 keyed timeout, 3 TX IQ underrun, 4 limit, 5 arm dropped, 6 retune needs RF-path change, ATU memory recall included (A3.9), 7 PA disabled by the host while keyed (B10.10), 8 keying client lost (TCI only, part C C8.2; never set by the radio over P2), 9 CW key-down longer than 1 s (B10.5a; TCI `KEYER`), 10 TX mode class changed while keyed (A3.9c); [31:24] limit id when reason 4"
    sent: "on every change (event)"
    source: "0007 Decisions 1, 2, 4; 0006; 0020 §8, §22; 0022 §1, §14, §25, §26, §28, §32"
  - name: TX_MODE_CLASS
    address: 0x0204
    access: "W, owner"
    content: "0 none declared (not writable); 1 SSB (including data modes sent as SSB), 2 CW, 3 AM, 4 FM; other values `BAD_VALUE`; power class 100 W PEP for 1, 2, 4 and 25 W carrier for 3 [G7250-MAN] (A3.4c); back to 0 at session end and at a takeover; a change to another value while keyed unkeys first (`TX_STATE` unkey reason 10, arm kept), then applies; the value in force is a no-op (A3.9c)"
    sent: "answer"
    source: "0007 Decision 4 rule 3; 0020 §9; 0022 §3, §17, §26"
  - name: KEYED_TIMEOUT
    address: 0x0205
    access: "W, owner"
    content: "ms; default 500; 100–500 accepted, other values `BAD_VALUE`; back to 500 at session end"
    sent: "answer"
    source: "0007 Decision 2; Resolved 2; 0020 §17"
  - name: WATCHDOG_STATE
    address: 0x0206
    access: "RO"
    content: "bit 0 General byte 38 bit [0] as last written; bit 1 effective state; bit 2 no General packet yet (counts as enabled)"
    sent: "on change"
    source: "0007 Decision 2.3; 0020 §8"
  - name: SAFETY_STATE
    address: 0x0210
    access: "RO"
    content: "0 normal, 1 fault"
    sent: "event"
    source: "0007 Decision 5; 0020 §8"
  - name: FAULT_CODE
    address: 0x0211
    access: "RO"
    content: "first cause, Table B8-3; 0 = none"
    sent: "event"
    source: "0007 Decision 5; 0006; 0020 §8"
  - name: FAULT_FLAGS
    address: 0x0212
    access: "RO"
    content: "bit *c* set for every fault code *c* (1–31) since the last clear"
    sent: "event"
    source: "0007 Decision 5; 0020 §8"
  - name: FAULT_CLASS
    address: 0x0213
    access: "RO"
    content: "0 none, 1 host-clearable, 2 latched until reset; the highest class among the codes set in `FAULT_FLAGS` (classes per code in Table B8-3; a class-1 code escalated by A3.5 counts as class 2)"
    sent: "event"
    source: "0007 Decision 5; 0022 §5, §27"
  - name: TRIP_COUNT
    address: 0x0214
    access: "RO"
    content: "limit trips with action `UNKEY` or stronger since power-on; saturates at 0xFFFFFFFF; not cleared over P2; survives `RESTART` and resets without power loss (A3.5)"
    sent: "event"
    source: "0007 Decision 5; 0020 §8; 0022 §27"
  - name: FAULT_CLEAR
    address: 0x0215
    access: "W, owner"
    content: "write the current `FAULT_CODE`; clears all flags if every flagged code is class 1 (not escalated), its condition is gone and 10 s have passed since the latest fault entry (A3.5), else `NOT_CLEARABLE`; other values `BAD_VALUE`"
    sent: "answer"
    source: "0007 Decision 5; 0022 §5, §27"
  - name: LIMIT_STATUS
    address: 0x0220
    access: "RO"
    content: "bit *n*: limit *n* limiting (`WARN` or `REDUCE`); bit 16 + *n*: limit *n* tripped (`UNKEY` or stronger) since the last TX request; limit ids in Table B8-3"
    sent: "event"
    source: "0006; 0007; 0020 §8"
  - name: LIMIT_INHIBIT
    address: 0x0221
    access: "RO"
    content: "bit *n* (1–15): limit id *n* holds an inhibit (Table A3-2: `LIMIT_PA_TEMP` above T3, `LIMIT_SUPPLY_VOLTAGE` over-voltage); bit 0 and bits 16–31 are 0; `TX_STATE` bit 5 is the OR of all bits"
    sent: "event"
    source: "0007 Decision 4; 0022 §32"
  - name: LIMIT_TX_TIME
    address: 0x0230
    access: "W, owner"
    content: "maximum continuous TX time, ms; built-in 300 000"
    sent: "answer"
    source: "0007 Resolved 3; 0020 §10"
  - name: LIMIT_FWD_POWER
    address: 0x0231
    access: "W, owner"
    content: "upper bound on forward power (PEP, A3.4c), mW, all bands and classes"
    sent: "answer"
    source: "0007 Decision 4; 0020 §10; 0022 §17"
  - name: LIMIT_SWR
    address: 0x0232
    access: "W, owner"
    content: "1000 × SWR; replaces S2 when stricter, S1 becomes the lower of S1 and this value"
    sent: "answer"
    source: "0007 Decision 4; 0020 §10"
  - name: LIMIT_PA_TEMP
    address: 0x0233
    access: "W, owner"
    content: "m°C; replaces T3 when stricter"
    sent: "answer"
    source: "0007 Decision 4; 0020 §10"
  - name: TLM_PA_TEMP
    address: 0x0300
    address_end: 0x0303
    access: "RO"
    content: "m°C, signed; sensors 0–3"
    sent: "slow"
    source: "0006; HIS-11"
  - name: TLM_PA_CURRENT
    address: 0x0304
    access: "RO"
    content: "mA"
    sent: "fast"
    source: "0006; HIS-11"
  - name: TLM_SUPPLY_CURRENT
    address: 0x0305
    access: "RO"
    content: "mA (if separate from PA current)"
    sent: "fast"
    source: "0006; HIS-11"
  - name: TLM_SWR
    address: 0x0306
    access: "RO"
    content: "1000 × SWR as used by the safety core; 0 = not valid"
    sent: "fast"
    source: "0006; 0007"
  - name: SENSOR_VALID
    address: 0x0307
    access: "RO"
    content: "bit *n* as record `telemetry` bit *n*; bit 7 PA temperature sensors 1–3"
    sent: "event"
    source: "0006; HIS-11; 0020 §8"
  - name: ATU_TUNE
    address: 0x0400
    access: "W, owner"
    content: "1 starts an ATU tune cycle (A3.9b; a TX request under the arm), 0 aborts; 1 while not armed: `NOT_ARMED`; 1 while keyed by another source: `KEYED`; neither is latched; 1 while the cycle runs: no-op; other values `BAD_VALUE`"
    sent: "answer"
    source: "0007 Decision 6; HIS-08; 0020 §8; 0022 §14, §22"
  - name: ATU_STATE
    address: 0x0401
    access: "RO"
    content: "0 off or bypassed, 1 in line, 2 tuning, 3 tuned, 4 failed"
    sent: "event"
    source: "0006; HIS-08; 0020 §8"
  - name: ANT_STATE
    address: 0x0500
    access: "RO"
    content: "[7:0] connector actually selected, from 1; 0 unknown"
    sent: "event"
    source: "0006; HIS-06; 0020 §8"
