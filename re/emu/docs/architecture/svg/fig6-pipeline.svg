<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <defs>
    <marker id="p6" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b3a4a"/></marker>
    <marker id="p6g" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3a6b3a"/></marker>
  </defs>
  <style>
    .re{fill:#eef2f6;stroke:#2b3a4a;stroke-width:1.6;}
    .emu{fill:#dfe9f2;stroke:#2b3a4a;stroke-width:2;}
    .his{fill:#f0e6da;stroke:#8a4b16;stroke-width:1.8;}
    .fw{fill:#e7efe3;stroke:#3a6b3a;stroke-width:2;}
    .gate{fill:#fff;stroke:#2b3a4a;stroke-width:1.3;}
    .t{fill:#17222e;} .tt{fill:#17222e;font-weight:bold;}
    .l{fill:#33506a;font-size:9px;}
    .flow{stroke:#2b3a4a;stroke-width:2;fill:none;}
    .data{stroke:#2b3a4a;stroke-width:1.6;fill:none;stroke-dasharray:5 3;}
    .cap{fill:#55707f;font-size:9px;}
    .boundary{stroke:#8a4b16;stroke-width:1.6;stroke-dasharray:7 5;fill:none;}
    .bl{fill:#8a4b16;font-size:9px;font-weight:bold;}
  </style>

  <text class="tt" x="360" y="20" text-anchor="middle" font-size="14">Pipeline to a tested, working alternative platform (§13.2)</text>

  <!-- clean-room boundary -->
  <line class="boundary" x1="470" y1="40" x2="470" y2="340"/>
  <text class="bl" x="250" y="54" text-anchor="middle">RE side (images, traces, models) — never crosses</text>
  <text class="bl" x="600" y="54" text-anchor="middle">clean-room side</text>

  <!-- g7250-base -->
  <rect class="re" x="30" y="70" width="180" height="70" rx="6"/>
  <text class="tt" x="120" y="90" text-anchor="middle">g7250-base</text>
  <text class="l" x="120" y="106" text-anchor="middle">RE docs + CSV (public)</text>
  <text class="l" x="120" y="120" text-anchor="middle">register maps, CI-V, buttons</text>
  <text class="l" x="120" y="134" text-anchor="middle">pinned as DATA (deps lock)</text>

  <!-- g7250-emu -->
  <rect class="emu" x="30" y="175" width="410" height="120" rx="6"/>
  <text class="tt" x="235" y="195" text-anchor="middle">g7250-emu — emulator + test suites + quality reports (this tooling)</text>
  <rect class="gate" x="46" y="208" width="120" height="70" rx="4"/>
  <text class="t" x="106" y="226" text-anchor="middle">emulator</text>
  <text class="l" x="106" y="240" text-anchor="middle">SS baseline</text>
  <text class="l" x="106" y="254" text-anchor="middle">+ image-map</text>
  <text class="l" x="106" y="268" text-anchor="middle">(no decryption)</text>
  <rect class="gate" x="176" y="208" width="120" height="70" rx="4"/>
  <text class="t" x="236" y="226" text-anchor="middle">test tiers</text>
  <text class="l" x="236" y="240" text-anchor="middle">L0–L7 · A1–A12</text>
  <text class="l" x="236" y="254" text-anchor="middle">P1/TCI/CI-V</text>
  <text class="l" x="236" y="268" text-anchor="middle">fault · perf</text>
  <rect class="gate" x="306" y="208" width="120" height="70" rx="4"/>
  <text class="t" x="366" y="226" text-anchor="middle">score + gates</text>
  <text class="l" x="366" y="240" text-anchor="middle">ROOD→RELEASE</text>
  <text class="l" x="366" y="254" text-anchor="middle">E0–E4 brick</text>
  <text class="l" x="366" y="268" text-anchor="middle">per-build report</text>

  <!-- g7250-his -->
  <rect class="his" x="250" y="70" width="190" height="70" rx="6"/>
  <text class="tt" x="345" y="90" text-anchor="middle">g7250-his</text>
  <text class="l" x="345" y="106" text-anchor="middle">hardware-interface spec</text>
  <text class="l" x="345" y="120" text-anchor="middle">reviewed · hardware facts only</text>
  <text class="bl" x="345" y="134" text-anchor="middle">the ONLY RE→FW bridge</text>

  <!-- g7250-fw -->
  <rect class="fw" x="500" y="120" width="190" height="130" rx="6"/>
  <text class="tt" x="595" y="140" text-anchor="middle">g7250-fw</text>
  <text class="l" x="595" y="156" text-anchor="middle">clean-room firmware</text>
  <text class="l" x="595" y="170" text-anchor="middle">NF-Main first (headless)</text>
  <text class="l" x="595" y="184" text-anchor="middle">NF-Control later (optional)</text>
  <text class="l" x="595" y="198" text-anchor="middle">reads only HIS + public specs</text>
  <text class="l" x="595" y="212" text-anchor="middle">+ emulator quality reports</text>
  <text class="l" x="595" y="232" text-anchor="middle">CI calls g7250-emu (pinned)</text>

  <!-- flows -->
  <line class="data" x1="120" y1="140" x2="120" y2="173" marker-end="url(#p6)"/>
  <text class="l" x="150" y="160" text-anchor="start">data</text>
  <path class="data" d="M210,100 C230,100 235,100 248,100" marker-end="url(#p6)"/>
  <text class="l" x="228" y="92" text-anchor="middle">hardware facts</text>
  <path class="flow" d="M440,105 C470,105 480,150 498,165" marker-end="url(#p6g)"/>
  <text class="bl" x="470" y="130" text-anchor="middle">HIS only</text>
  <!-- emu reports to fw -->
  <path class="flow" d="M440,235 C470,235 475,210 498,205" marker-end="url(#p6g)"/>
  <text class="l" x="468" y="250" text-anchor="middle">reports (gate E4)</text>
  <!-- fw build back into emu as test target -->
  <path class="flow" d="M595,250 C595,320 360,330 236,282" marker-end="url(#p6)"/>
  <text class="l" x="430" y="328" text-anchor="middle">each NF build → tested in g7250-emu (EH)</text>

  <!-- gating ladder bottom -->
  <rect class="gate" x="30" y="360" width="660" height="110" rx="6"/>
  <text class="tt" x="360" y="380" text-anchor="middle">Gating a firmware build toward RELEASE (minimal brick risk)</text>
  <g font-size="10">
    <rect class="gate" x="46" y="392" width="118" height="60" rx="4" fill="#f6eaea"/>
    <text class="t" x="105" y="410" text-anchor="middle">ORANJE</text><text class="l" x="105" y="424" text-anchor="middle">develop in emu</text><text class="l" x="105" y="438" text-anchor="middle">hard gates green</text>
    <rect class="gate" x="176" y="392" width="118" height="60" rx="4" fill="#eef4ee"/>
    <text class="t" x="235" y="410" text-anchor="middle">GROEN-EMU</text><text class="l" x="235" y="424" text-anchor="middle">score≥75 · E4</text><text class="l" x="235" y="438" text-anchor="middle">hand-off to fw</text>
    <rect class="gate" x="306" y="392" width="118" height="60" rx="4" fill="#eef4ee"/>
    <text class="t" x="365" y="410" text-anchor="middle">GROEN-HIL</text><text class="l" x="365" y="424" text-anchor="middle">twin + F0–F2</text><text class="l" x="365" y="438" text-anchor="middle">first flash (RX-only)</text>
    <rect class="gate" x="436" y="392" width="118" height="60" rx="4" fill="#e7efe3"/>
    <text class="t" x="495" y="410" text-anchor="middle">RELEASE</text><text class="l" x="495" y="424" text-anchor="middle">HIL TX steps</text><text class="l" x="495" y="438" text-anchor="middle">+ soak + review</text>
    <rect class="gate" x="566" y="392" width="108" height="60" rx="4"/>
    <text class="t" x="620" y="410" text-anchor="middle">HIL bench</text><text class="l" x="620" y="424" text-anchor="middle">H-G1…H-G5</text><text class="l" x="620" y="438" text-anchor="middle">final stage</text>
  </g>
  <line class="flow" x1="164" y1="422" x2="175" y2="422" marker-end="url(#p6)"/>
  <line class="flow" x1="294" y1="422" x2="305" y2="422" marker-end="url(#p6)"/>
  <line class="flow" x1="424" y1="422" x2="435" y2="422" marker-end="url(#p6)"/>
  <line class="flow" x1="554" y1="422" x2="565" y2="422" marker-end="url(#p6)"/>
</svg>
